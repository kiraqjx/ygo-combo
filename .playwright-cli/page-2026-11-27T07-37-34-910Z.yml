          - generic [ref=f12e108]:
            - generic [ref=f12e109]: 结果怎么读
            - generic [ref=f12e111]:
              - paragraph [ref=f12e112]: 起手是抽 5 张直接满足条件的概率，和常规工具一致。
              - paragraph [ref=f12e113]: 启动条件是「组间或、组内且」。每条检查是一组卡（可以只有一张，也可以多张）的 合计张数区间：≥1 表示这几张里至少上手 1 张，≥2 表示合计至少 2 张， ≤N 表示合计最多 N 张（≥1 且 ≤1 就是「恰好 1 张」），合计 ≤0 就是一张都不能上手（废件）。
              - paragraph [ref=f12e114]: 多张卡并进同一条检查时算的是总数：A、B 合计 ≥1 是「A 或 B 任意一张」， A、B、C 合计 ≤1 是「这几张废件加起来最多 1 张」。同名卡按实际张数计入合计。
              - paragraph [ref=f12e115]: 废件写在启动条件里：同一张废件对某条路线致命、对另一条无所谓，就分别建组—— 带它的手牌满足不了「合计 0」的那一组，但可以满足另一组。组内可以同时有多条检查。
              - paragraph [ref=f12e116]: 旧存档里的全局废件会在读取配置时自动并入启动条件： 每条废件变成一条「这些卡合计 ≤N」的检查，带豁免的按「或」拆成多个启动组。
              - paragraph [ref=f12e117]: 效果 = 算子序列。「看 N 张 → 拿 M 张 → 其余去哪」是挖牌，「丢 N 张」是消耗。 抽 2 就是「看 2 拿 2」，翻 6 拿 1 就是「看 6 拿 1，其余送墓」，抽 3 丢 2 就是「看 3 拿 3」+「丢 2」。
              - paragraph [ref=f12e118]: 算子是按顺序执行的，所以强贪壶这种「顶 10 除外，再抽 2」、手札抹杀这种 「先丢光手牌，再抽 5」都能直接拼出来。
              - paragraph [ref=f12e119]: 发动条件（速攻 2 卡动）只有在手牌满足时才会执行，不满足时整个效果被跳过。
              - paragraph [ref=f12e120]:
                - text: 发动条件怎么拼：追加方式三选一 —— 「新开一组」是组间或（任意一组成立就能发动）； 「组内且」是在最后一组里再加一条检查（两条都要满足）； 「并入上一条」是把卡并进最后一条检查（这几张算合计，任意一张即可）。 所以「A 且（B 或 C 或 D）」= 一组里两条检查：
                - code [ref=f12e121]: A ≥1
                - text: 且
                - code [ref=f12e122]: B、C、D 合计 ≥1
                - text: ， 先加 A，切「组内且」加 B，再切「并入上一条」把 C、D 并进去。
              - paragraph [ref=f12e123]: 选卡器支持多选（一次勾好几张再点「确定添加」）：多选的卡按当前方式落地 —— 「新开一组」会变成一组里一条检查（这几张任意一张即可）； 「组内且」每张各起一条检查（都要上手）； 「并入上一条」全部并进最后一条检查（任意一张即可）。 启动条件那边同理：多选 = 并进同一条检查（或），想「且」就分几条检查加。
              - paragraph [ref=f12e124]: 来源卡会自动进发动条件：选中效果来源时会默认补一条「这张卡 ≥1」，因为没上手就发动不了； 从墓地 / 除外发动的效果不需要这条，删掉即可。发动后的消耗（丢手牌）仍要用「丢手牌」算子体现。
              - paragraph [ref=f12e125]:
                - text: 公式：起手启动率是对所有满足条件的起手构成求和
                - code [ref=f12e126]: Σ Πᵢ C(nᵢ, hᵢ) / C(N, n)
                - text: （nᵢ 是这张卡的投入张数，hᵢ 是抽到的张数）； 加入抽滤后按
                - code [ref=f12e127]: V(k) = Σ 抽牌结果概率 × max(拿哪几张 / 丢哪几张) V(k+1)
                - text: 做值迭代，所以拿牌 / 丢牌都取「最优操作」，得到的是这条路线能打出的上界。
              - paragraph [ref=f12e128]: 怎么验证：「起手核对器」可以挑一手具体的牌，看到每一组差哪些检查、 合计区间有没有踩线，用来人工核对规则；「蒙特卡洛交叉校验」会用同一份配置强制再抽 20,000 次（固定种子），和精确解对照。 精确解是最优操作下的结果，仿真用启发式出牌，所以仿真略低属正常；显著更高才说明实现有问题。
              - paragraph [ref=f12e129]: 精确解基于「等价类压缩 + 对算子做值迭代」，状态上限 12 万、单次预算 1200ms 内跑完，同一份配置的数字可复现； 仿真解会显示置信区间。
